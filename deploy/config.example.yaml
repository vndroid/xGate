# xgate 配置示例，默认路径 /etc/xgate/config.yaml

api:
  # "host:port" 或 "unix:/run/xgate/api.sock"。
  # 监听非回环地址时，必须设置 token / token_file 或 tls.client_ca（mTLS）。
  listen: 127.0.0.1:7070
  # token_file: /etc/xgate/token
  # tls:
  #   cert: /etc/xgate/server.crt
  #   key: /etc/xgate/server.key
  #   client_ca: /etc/xgate/clients-ca.crt

db: /var/lib/xgate/xgate.db

nft:
  binary: nft
  table: xgate

# 以下两个命令仅在删除时带 ?kill=true 才会用到
conntrack:
  binary: conntrack # conntrack-tools 1.4.5+
ss:
  binary: ss # iproute2；销毁后端 socket，需要内核开启 CONFIG_INET_DIAG_DESTROY

# 定期对账间隔；TTL 到期时会额外触发一次
reconcile_interval: 30s

# 不带 "force": true 时允许的最短前缀
min_prefix_len:
  ipv4: 8
  ipv6: 32

# 所有转发规则共用同一份白名单
forwards:
  - name: default
    listen_port: 35353
    target_port: 8080
    protocols: [tcp, udp]
    # 丢弃从外部直接访问 target_port 的流量（默认 true）
    protect_target: true
